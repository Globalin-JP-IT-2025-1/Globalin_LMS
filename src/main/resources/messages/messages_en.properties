etc72.content=Chapter 1 General Provisions<br>Article 1 (Purpose)<br>This Agreement sets forth the terms and conditions, procedures for use of services and materials provided by Globalin Library (hereinafter "Library"), the rights, obligations, and responsibilities of users and the Library, and other related matters.<br><br>Article 2 (Definitions)<br>① The definitions of terms used in this Agreement are as follows:<br><br>"Library" refers to Globalin Library.<br>"Service" refers to both the use of the online site and the use of the offline library.<br>"Site" refers to the Globalin Library homepage (http://). The domain may change after the homepage is opened in June 2025.<br>"Member" refers to a person who has registered as a member by agreeing to the Terms and Conditions and providing personal information through the homepage and the material search program, and is eligible to use the materials and services provided by the Library.<br>"Service Contract" refers to all contracts concluded between the Library and members related to the use of services, including these Terms and Conditions.<br>"Library Membership Card" refers to a card approved by the Library for borrowing materials outside the Library.<br>"Member ID (email)" means a combination of letters and numbers selected by the member for identification and service use.<br>"Password" means a unique combination of letters and numbers set by the member to verify their identity associated with their ID.<br>"Post" means any writings, photos, videos, files, links, etc. posted by the member while using the service.<br>"Withdrawal" means the termination of the service contract by the member.<br>② Terms not defined in paragraph 1 shall be governed by relevant laws or site-specific guidelines, and otherwise by general customs.<br><br>Article 3 (Effect and Amendment of the Agreement)<br>① This Agreement is publicly announced online through the Site. The Library may revise this Agreement within the scope not violating relevant laws in case of reasonable cause. The revised Agreement takes effect once duly notified on the Site.<br>② Members must regularly visit the Site to check for any changes to the Agreement. The Library is not responsible for any damage suffered by members due to lack of knowledge of such changes.<br>③ Members who do not agree to the amended Agreement may request withdrawal (termination) of their membership.<br><br>Article 4 (Rules Outside the Agreement)<br>① The Library may establish separate rules or guidelines ("Service-Specific Guidelines") for individual services if necessary. In the event of conflict, the Service-Specific Guidelines shall prevail.<br>② Matters not specified in this Agreement shall be governed by the Telecommunications Basic Act, the Telecommunications Business Act, the Act on Promotion of Information and Communications Network Utilization and Information Protection, and other relevant laws.<br><br>Chapter 2 Formation and Termination of Service Contract<br>Article 5 (Formation of Service Contract)<br>① The Service Contract is formed when a person wishing to become a member agrees to these Terms and Conditions and the Library approves the application.<br>② Agreement is indicated by clicking the "Agree" button during the application process on the material search system or the homepage.<br><br>Article 6 (Membership Registration and Withdrawal)<br>① Membership registration is completed when the applicant fills out the required information on the designated online form and the Library staff confirms it in person.<br>② Upon registration, the member is also registered as an integrated member of public libraries.<br>③ All members must provide true personal information to use the service; using false information or impersonating another person results in loss of rights and may lead to legal consequences.<br>④ Membership may be canceled in the following cases:<br>- Applying with another person's identity<br>- Submitting false information<br>- A child under 14 years of age without consent of a legal representative<br>- Applying for the purpose of disturbing social order or public morals<br>- Hindering other users or stealing information<br>- Conducting acts prohibited by law or this Agreement<br>- Failing to meet membership requirements set by the Library<br>⑤ Members must promptly notify the Library of any changes to their registration information.<br>⑥ Members wishing to terminate their contract must request withdrawal themselves.<br>⑦ The library membership card becomes invalid upon withdrawal.<br>⑧ If the member has borrowed materials outside the Library, withdrawal is only possible after returning the materials.<br>⑨ Posts and information provided by the member are retained or deleted for a certain period according to Library policy.<br><br>Article 7 (Approval and Restriction of Application)<br>① The Library approves applications in order of receipt if there is no business or technical obstacle.<br>② Approval may be withheld if the application violates Library regulations.<br>③ The Library may withhold approval if:<br>- There is insufficient system capacity<br>- There are technical difficulties with the system<br>- There are other reasons attributable to the Library<br>④ If any reason under Article 6 Paragraph 4 is found after completion of registration, the Library may cancel approval.<br><br>Article 8 (Protection and Use of Personal Information)<br>① The Library protects member information according to the Personal Information Protection Act.<br>② Only the member may view, modify, or delete their own personal information. Members are responsible for managing their password and must immediately report any unauthorized use. The member is liable for damages caused by not reporting.<br>③ The Library will not provide personal information collected during service provision to third parties without consent, except:<br>- When requested by investigative or government agencies<br>- When necessary for the verification of violations of law or these Terms<br>- When required by law<br><br>Chapter 3 Service Provision and Use<br>Article 9 (Provision of Service)<br>① Service begins when the Library approves the member's application, except for some services that may start on designated dates.<br>② Online services (homepage) are generally available 24/7 unless there are operational or technical difficulties; planned maintenance will be announced in advance on the homepage.<br>③ Offline services (material rooms) are not available on regular holidays (every Monday) and public holidays; such holidays are announced on the homepage.<br>④ The Library may temporarily suspend some or all services without notice in the event of emergency maintenance, expansion, replacement, equipment failure, service congestion, national emergencies, power outages, or other unavoidable circumstances.<br>⑤ The Library may suspend all or part of the service after prior notice if required for service restructuring or operation.<br><br>Article 10 (Changes to Service)<br>① The Library may change all or part of the services if necessary for operational or technical reasons.<br>② Changes in the content, method, or time of service shall be notified on the initial screen before such changes take effect.<br>③ The Library may modify, suspend, or change free services without compensation after prior notice.<br><br>Article 11 (Restriction of Service Use)<br>① The Library may restrict, reset, terminate the contract, or take other measures if a member violates Article 13 or:<br>- Registers false information or impersonates others<br>- Posts obscene, defamatory, or privacy-infringing content<br>- Harasses or threatens other members<br>- Encourages illegal copying or hacking<br>- Posts for commercial advertising purposes<br>- Changes programs or servers without permission<br>- Uses obtained information for non-service purposes<br>- Pretends to be Library staff or intentionally interferes with service<br>- Is ordered to do so by public authorities<br>- Violates rules, is associated with crimes, or violates laws<br>② Members may appeal such restrictions according to Library procedures, and if deemed valid, service will be resumed immediately.<br><br>Chapter 4 Obligations of Parties<br>Article 12 (Obligations of the Library)<br>① The Library must make the service available from the requested start date unless there are special reasons.<br>② The Library must promptly repair or restore facilities in the event of failure or loss.<br>③ The Library must establish a security system for personal information protection and publicly announce and comply with its privacy policy.<br>④ The Library must promptly handle justified opinions or complaints from members, or inform them of reasons and schedules if not possible.<br>⑤ The Library is not responsible for service interruptions due to reasons attributable to members.<br><br>Article 13 (Obligations of Members)<br>① Members must provide accurate personal information when applying or changing their information. Providing false or another person's information results in loss of rights.<br>② Members must comply with laws, this Agreement, usage guidelines, Library notices, and must not harm the Library, disrupt operations, damage the Library's reputation, or harm others.<br>③ Members must not allow third parties to use their ID, member number, or password, and must promptly notify the Library of any changes.<br>④ Members may not conduct commercial activities using the service without prior approval, and are liable for any resulting damages. The Library may restrict service and claim compensation as needed.<br>⑤ Members may not transfer, assign, or provide as security their rights under the contract to others without express consent.<br>⑥ Members may not copy, reproduce, modify, translate, publish, or broadcast information obtained from the Library, or provide it to others without prior approval.<br>⑦ Members may not infringe on the intellectual property rights of the Library or others, nor:<br>- Illegally use another member's number<br>- Engage in criminal or related activities<br>- Violate public morals or order<br>- Defame or insult others<br>- Infringe on intellectual property rights<br>- Spread viruses or hack<br>- Continuously send unsolicited advertising<br>- Interfere with safe service operation<br><br>Chapter 5 Termination of Contract<br>Article 14 (Compensation for Damages)<br>The Library is not responsible for any damages to members unless caused by intent or negligence.<br><br>Article 15 (Disclaimer)<br>① The Library is exempt from liability if unable to provide the service due to force majeure such as natural disasters, war, or suspension of service by telecommunications providers.<br>② The Library is exempt from liability for damages caused by maintenance, replacement, inspection, or construction.<br>③ The Library is not responsible for damages caused by member's computer errors or incomplete information.<br>④ The Library is not responsible for members failing to achieve desired results, or for damages from materials obtained during use.<br>⑤ The Library is not responsible for the credibility or accuracy of posts or materials, or for disputes among members or with third parties arising from the service.<br>⑥ The Library is not obliged to pre-screen or monitor posts and is not responsible for their results.<br><br>Article 16 (Jurisdiction)<br>The Seoul District Court shall have jurisdiction over disputes arising from the use of the service.<br><br>Supplementary Provisions<br>This Agreement shall take effect on June 1, 2025.<br>The Agreement shall become effective as soon as the user registers as a member.<br>


etc73.privacy_policy=All personal information handled by Globalin Library is collected, retained, and processed based on relevant laws or with the consent of the data subject.<br>\
The Personal Information Protection Act sets forth general standards for the handling of such personal information, and Globalin Library will appropriately and legally handle personal information collected, retained, and processed in accordance with these regulations to ensure the proper performance of public tasks and the protection of users' rights and interests.<br>\
Globalin Library also respects your rights regarding the viewing, correction, deletion, and request to suspend processing of personal information held by Globalin Library in accordance with applicable laws, and users may file an administrative appeal as stipulated by the Administrative Appeals Act if such rights are infringed.<br>\
The privacy policy of Globalin Library consists of three parts: [Protection of personal information of website users] for users of various websites operated by Globalin Library, [Protection of personal information processed by computer] for personal information necessary for the performance of relevant duties, and [CCTV Installation and Operation Guidelines] provided by Yeongdeungpo-gu Office for information protection related to CCTV installation and operation.<br><br>\
Article 1: Purpose of Processing Personal Information<br>\
1. Personal information is processed for the following purposes. Processed personal information will not be used for purposes other than the following. If the purpose of use is changed, necessary measures will be taken in accordance with Article 18 of the Personal Information Protection Act, such as obtaining separate consent.<br>\
A. Service provision<br>- Personal information is processed for the purpose of providing services related to library use (borrowing/returning materials, identity verification, satisfaction surveys, certificate issuance, etc.).<br>\
B. Complaint handling<br>- Personal information is processed for handling complaints related to library use, submitting opinions, requests for access, correction, deletion, suspension of processing of personal information, and reporting personal information leakage incidents.<br>\
2. The purposes of processing personal information by Globalin Library are as follows:<br>\
<table><tr><th>No.</th><th>Personal Information File Name</th><th>Purpose of Processing</th><th>Remarks</th></tr>\
<tr><td>1</td><td>Library Membership DB</td><td>Identification for using library services such as borrowing books</td><td></td></tr></table>\
<br>Article 2: Processing and Retention Period of Personal Information<br>\
1. In principle, personal information is destroyed without delay once the processing purpose is achieved.<br>\
2. Globalin Library collects and uses personal information within the scope of the retention and use period received from the data subject at the time of collection, in accordance with relevant laws. The retention and use periods for each personal information are as follows:<br>\
- A. Service provision, simple reporting, administrative reference and certification documents: 1~3 years<br>\
- B. Accounting processing and supporting documents for payment collection: 5 years<br>\
- Library Membership DB: Article 28 of the Library Act, until the member’s consent is withdrawn (renewed consent every 2 years)<br><br>\
Article 3: Provision of Personal Information to Third Parties<br>\
1. Globalin Library provides personal information to third parties only when it falls under Articles 17 and 18 of the Personal Information Protection Act, such as the consent of the data subject or special provisions of the law, and does not provide personal information to third parties in other cases.<br>\
2. To handle requests for access, correction, deletion, and suspension of personal information, the personal information of the applicant is made available to the institution holding the personal information file.<br>\
3. The user information for requests for access, correction, deletion, suspension, and destruction of personal information is as follows:<br>\
A. When the data subject applies for access, correction, deletion, suspension, or destruction to a public institution, relevant personal information related to the complaint is provided to the public institution and is retained and used until the complaint is completed.<br>\
B. Items of personal information provided: name, date of birth, phone number, address of the applicant<br><br>\
Article 4: Outsourcing of Personal Information Processing<br>\
1. Globalin Library outsources personal information processing tasks as follows for efficient personal information management:<br>\
<table><tr><th>No.</th><th>Outsourced Task</th><th>Contractor</th><th>Address</th><th>Phone Number</th></tr>\
<tr><td>1</td><td>Website Maintenance</td><td>Globalin</td><td>○○-ro 1, Yeongdeungpo-gu, Seoul</td><td>02-000-0000</td></tr></table>\
<br>Article 5: Rights and Obligations of Data Subjects and How to Exercise Them<br>\
1. Data subjects (including legal representatives if under 14 years old) may exercise the following personal information protection rights at any time:<br>\
- Request to view personal information<br>- Request correction if there are errors<br>- Request deletion<br>- Request suspension of processing<br>\
2. The exercise of rights in Paragraph 1 can be made in writing, by e-mail, or by fax to Globalin Library in accordance with Article 41, Paragraph 1 of the Enforcement Decree of the Personal Information Protection Act, and Globalin Library will take action without delay.<br>\
3. If the data subject requests correction or deletion due to errors in personal information, the personal information will not be used or provided until correction or deletion is completed.<br>\
4. Rights under Paragraph 1 can be exercised through the data subject's legal representative or an agent. In this case, a power of attorney in the form prescribed in Appendix 11 of the Personal Information Processing Method Notice must be submitted.<br>\
5. Requests for access and suspension of processing may be restricted pursuant to Article 35(4) and Article 37(2) of the Personal Information Protection Act.<br>\
6. Requests for correction and deletion of personal information cannot be made if the collection of the personal information is specified by other laws.<br>\
7. Globalin Library verifies whether the requester is the data subject or a legitimate agent when responding to requests for access, correction, deletion, or suspension of processing of personal information.<br><br>\
Article 6: Items of Personal Information Processed<br>\
<table><tr><th>No.</th><th>Personal Information File Name</th><th>Items Processed</th></tr>\
<tr><td>1</td><td>Library Membership DB</td><td>Name, Password, Address, Mobile Number, Email</td></tr></table>\
<br>Article 7: Procedures and Methods for Destroying Personal Information<br>\
1. In principle, if the purpose of processing personal information has been achieved, consent for the collection and use of personal information is withdrawn, the retention and use period has expired, or grounds for destruction such as business closure arise, the relevant personal information will be destroyed without delay. However, if preservation is required by other laws, this is not the case.<br>\
2. The procedures, deadlines, and methods for destruction are as follows:<br>A. Destruction procedures<br>- Unnecessary personal information and files are processed according to internal policy procedures under the responsibility of the person in charge of personal information.<br>- Personal information for which the retention period has expired is destroyed without delay from the expiration date.<br>- If the purpose of processing, the relevant service, or the business is no longer required, the files are destroyed without delay.<br>B. Destruction methods<br>- Information in electronic form is deleted by technical means that make recovery impossible.<br>- Paper documents are shredded or incinerated.<br><br>\
Article 8: Measures to Ensure the Security of Personal Information<br>Globalin Library takes the following technical, managerial, and physical measures necessary to ensure the security of personal information under Article 29 of the Personal Information Protection Act:<br>\
1. Establishment and implementation of internal management plans<br>2. Minimization and education of personal information handlers<br>3. Restriction of access to personal information<br>4. Storage and prevention of forgery or alteration of access records<br>5. Encryption of personal information<br>6. Technical measures against hacking<br>7. Access control of unauthorized persons<br><br>\
Article 9: Personal Information Protection Manager<br>Globalin Library appoints a personal information protection officer and staff in charge.<br>- Protection Officer: Lee ** / CEO / Yeongdeungpo Cultural Foundation / Phone: 0000-0000<br>- Staff in Charge: Lee ** / Library Operations Team Leader / Phone: 0000-0000<br><br>\
Article 10: Personal Information Access Window<br>In accordance with Article 35 of the Personal Information Protection Act, you may request access to personal information from the following department:<br>\
<table><tr><th>No.</th><th>Department</th><th>Person in Charge</th><th>Address</th><th>Place</th><th>Contact</th></tr>\
<tr><td>1</td><td>Globalin Library</td><td>Kim **</td><td>**-ro 1, Yeongdeungpo-gu, Seoul</td><td>1st Floor Office</td><td>02-000-0000</td></tr></table>\
<br>Article 11: Remedies for Infringement of Rights<br>Data subjects may request remedies for infringement of personal information from the following institutions:<br>\
- Personal Information Infringement Report Center (118 / privacy.kisa.or.kr)<br>\
- Personal Information Dispute Mediation Committee (1833-6972 / kopico.go.kr)<br>\
- Supreme Prosecutors' Office Cyber Crime Investigation Division (1301 / cybercid@spo.go.kr)<br>\
- National Police Agency Cyber Security Bureau (182 / https://ecrm.police.go.kr)<br>\
- Central Administrative Appeals Commission (www.simpan.go.kr)<br><br>\
Article 12: Installation and Operation of Video Information Processing Equipment<br>\
1. Purpose of installation: Facility management and disaster prevention<br>\
2. Number and location of installations: 46 units in total (lobby, parking lot, etc.)<br>\
3. Recording time: 24 hours / Retention period: 30 days<br>\
4. Storage location and method: Stored and managed at each library's storage<br>\
5. Request for access to video information: Submit a written request with justification<br>\
6. Security measures: Access control, encrypted storage, keeping storage records, etc.<br>
