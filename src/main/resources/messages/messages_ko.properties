<br>제7조 개인정보의 파기 절차 및 방법<br>\
1. 원칙적으로 개인정보 처리 목적이 달성되었거나 개인정보의 수집 및 이용에 대한 동의를 철회하는 경우, 개인정보 보유 및 이용기간이 종료한 경우, 사업폐지 등의 파기 사유 발생 시 지체없이 해당 개인정보를 파기합니다. 다만, 다른 법률에 따라 보존하여야하는 경우에는 그러하지 않습니다.<br>\
2. 파기의 절차, 기한 및 방법은 다음과 같습니다.<br>가. 파기절차<br>- 불필요한 개인정보 및 개인정보파일은 개인정보책임자의 책임 하에 내부방침 절차에 따라 다음과 같이 처리하고 있습니다.<br>- 보유기간이 경과한 개인정보는 종료일로부터 지체 없이 파기합니다.<br>- 개인정보파일의 처리목적 달성, 해당 서비스의 폐지, 사업의 종료 등 개인정보파일이 불필요하게 되었을 때에는 지체 없이 파기합니다.<br>나. 파기방법<br>- 전자적 형태의 정보는 복구 불가능한 기술적 방법으로 삭제합니다.<br>- 종이 문서는 분쇄하거나 소각합니다.<br><br>\
제8조 개인정보의 안전성 확보 조치<br>글로벌인 도서관은 개인정보보호법 제29조에 따라 다음과 같이 안전성 확보에 필요한 기술적, 관리적, 물리적 조치를 하고 있습니다.<br>\
1. 내부관리계획 수립 및 시행<br>2. 개인정보 취급 담당자의 최소화 및 교육<br>3. 개인정보에 대한 접근 제한<br>4. 접속기록의 보관 및 위변조 방지<br>5. 개인정보의 암호화<br>6. 해킹 등에 대비한 기술적 대책<br>7. 비인가자에 대한 출입 통제<br><br>\
제9조 개인정보보호 책임자<br>글로벌인 도서관은 개인정보 보호책임자 및 실무담당자를 지정하고 있습니다.<br>- 보호책임자: 이** / 대표이사 / 영등포문화재단 / 전화: 0000-0000<br>- 실무담당자: 이** / 도서관운영팀장 / 전화: 0000-0000<br><br>\
