<br>第7条 個人情報の廃棄手続きおよび方法<br>\
1. 原則として、個人情報の処理目的が達成された場合、または個人情報の収集・利用に関する同意を撤回した場合、個人情報の保有・利用期間が終了した場合、事業廃止など廃棄事由が発生した場合、該当個人情報を遅滞なく廃棄します。ただし、他の法律により保存が必要な場合はこの限りではありません。<br>\
2. 廃棄の手続き、期限および方法は次のとおりです。A. 廃棄手続き<br>- 不要な個人情報および個人情報ファイルは、個人情報責任者の責任のもと、内部方針手続きに従って次のように処理されています。<br>- 保有期間が経過した個人情報は、終了日から遅滞なく廃棄します。<br>- 個人情報ファイルの処理目的達成、該当サービスの廃止、事業終了等、個人情報ファイルが不要になった場合は遅滞なく廃棄します。B. 廃棄方法<br>- 電子的な情報は、復元不可能な技術的方法で削除します。<br>- 紙の書類は粉砕または焼却します。<br><br>\
第8条 個人情報の安全性確保措置<br>グローバルイン図書館は、個人情報保護法第29条に基づき、次のように安全性確保に必要な技術的・管理的・物理的措置を実施しています。<br>\
1. 内部管理計画の策定および実施<br>2. 個人情報取扱担当者の最小化および教育<br>3. 個人情報へのアクセス制限<br>4. アクセス記録の保管および改ざん防止<br>5. 個人情報の暗号化<br>6. ハッキング等への技術的対策<br>7. 非認可者への出入統制<br><br>\
