<br>第5条 情報主体の権利および義務、行使方法に関する事項<br>\
1. 情報主体（14歳未満の場合は法定代理人を含む）は、グローバルイン図書館に対し、いつでも次の各項目の個人情報保護に関する権利を行使することができます。<br>\
- 個人情報閲覧請求<br>- 誤り等がある場合の訂正要求<br>- 削除要求<br>- 処理停止要求<br>\
2. 第1項に基づく権利行使は、グローバルイン図書館に対し、個人情報保護法施行令第41条第1項により、書面、電子メール、FAX等で行うことができ、グローバルイン図書館はこれに遅滞なく対応します。<br>\
3. 情報主体が個人情報の誤り等による訂正または削除を要求した場合、訂正または削除が完了するまで当該個人情報を利用または提供しません。<br>\
4. 第1項に基づく権利行使は、情報主体の法定代理人または委任を受けた者を通じて行うことができます。この場合、個人情報処理方法に関する告示別紙第11号様式による委任状を提出する必要があります。<br>\
5. 個人情報の閲覧および処理停止要求は、個人情報保護法第35条第4項、第37条第2項により、情報主体の権利が制限される場合があります。<br>\
6. 個人情報の訂正および削除要求は、他の法令でその個人情報が収集対象として明示されている場合、その削除を要求することはできません。<br>\
7. グローバルイン図書館は、情報主体権利に基づく閲覧要求、訂正・削除要求、処理停止要求時に、要求者が本人または正当な代理人であるかを確認します。<br><br>\
