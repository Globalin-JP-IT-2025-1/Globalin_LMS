# 홈페이지 이용 안내 / 이용약관
etc72.content=第1章 総則<br>第1条（目的）<br>本規約は、グローバルイン図書館（以下「図書館」）が提供するサービス（以下「サービス」）および資料の利用条件および手続き、利用者と図書館の権利、義務、責任事項およびその他諸般の事項を定めることを目的とします。<br><br>第2条（定義）<br>①本規約で使用される用語の定義は次のとおりです。<br><br>「図書館」とは、グローバルイン図書館を指します。<br>「サービス」とは、オンラインサイトの利用およびオフライン図書館の利用の両方を意味します。<br>「サイト」とは、グローバルイン図書館ホームページ（http://）を指します。2025年6月にホームページが開設され、以降ドメインが変更される場合があります。<br>「会員」とは、ホームページおよび資料検索プログラムを通じて利用規約と個人情報提供に同意し、会員登録をした者で、図書館が提供する資料およびサービスを利用できる者を指します。<br>「利用契約」とは、本規約を含むサービス利用に関連し、図書館と会員間で締結されるすべての契約を指します。<br>「図書会員証」とは、図書館外で資料を貸出するために図書館が承認したカードを指します。<br>「会員ID（メールアドレス）」とは、会員の識別とサービス利用のため、会員が選定する英字および数字の組み合わせを指します。<br>「パスワード」とは、IDで識別される会員の本人確認のため、会員が設定した固有の文字および数字の組み合わせを指します。<br>「投稿」とは、会員がサービスを利用しながら投稿した文、写真、動画など各種ファイルやリンク等を指します。<br>「退会」とは、会員が利用契約を終了することを意味します。<br>②本規約で使用される用語のうち、第1項で定義されていない用語は、関係法令およびサイトごとの案内に従い、それ以外は一般慣例によります。<br><br>第3条（規約の効力および変更）<br>①本規約はサイトを通じてオンラインで公示され、合理的な理由が発生した場合、図書館は関係法令に違反しない範囲で改定することができます。改定された規約は、正当な手続きを経てサイトを通じて告知されることにより効力を発揮します。<br>②会員は定期的にサイトを訪問し、規約の変更事項を確認しなければなりません。変更された規約について知らなかったことによる会員の被害については、図書館は責任を負いません。<br>③会員は、変更された規約に同意しない場合、退会（解約）を申請できます。<br><br>第4条（規約外の準則）<br>①図書館は必要に応じて、個別サービスに関して規約および利用規定（以下「サービス別案内」）を定めることができ、本規約と相反する場合にはサービス別案内の内容を優先して適用します。<br>②本規約に明記されていない事項は、電気通信基本法、電気通信事業法、情報通信網利用促進および情報保護等に関する法律およびその他関係法令の規定に従います。<br><br>第2章 利用契約の成立および解約<br>第5条（利用契約の成立）<br>①利用契約は、会員になろうとする者が本利用規約に同意し、利用申請に対して図書館の承諾によって成立します。<br>②利用契約への同意は、利用申請時に図書館の資料検索システム・ホームページの「同意する」ボタンを押すことで意思表示を行います。<br><br>第6条（会員登録および退会）<br>①会員登録は申請者がオンラインで当サイトが提供する所定の申込フォームに必要事項を入力し申請後、図書館職員との対面確認を経て会員登録が完了します。<br>②会員登録と同時に公立図書館の統合図書会員として登録されます。<br>③すべての会員は必ず本人の情報を提供しなければサービスを利用できず、他人の情報を盗用したり虚偽の情報を登録するなど本人の真正な情報を登録しない場合、サービス利用に関して一切の権利を主張できず、関係法令により処罰されることがあります。<br>④次のいずれかに該当する場合、会員登録を取り消すことができます。<br>- 他人の名義を使用して申請した場合<br>- 会員登録申請内容を虚偽に記載した場合<br>- 満14歳未満の児童が法定代理人（親等）の同意を得ていない場合<br>- 社会の安寧秩序や善良な風俗を害する目的で申請した場合<br>- 他人のサービス利用を妨害したり、その情報を盗用するなどの行為を行った場合<br>- サービス利用にあたり法令や本規約で禁止されている行為をする場合<br>- 図書館が定めた会員登録要件が満たされていない場合<br>⑤会員は会員情報登録事項に変更がある場合、直ちに情報修正などその他の方法で当図書館にその変更事項を知らせなければなりません。<br>⑥会員は利用契約を解約しようとする場合、本人が退会を申請しなければなりません。<br>⑦図書会員証は退会と同時に使用できなくなります。<br>⑧図書館資料を館外貸出中の場合、必ず資料を返却した後に退会を行う必要があります。<br>⑨会員が作成した投稿および提供した情報は図書館ポリシーにより一定期間維持され、保管または消滅します。<br><br>第7条（利用申請の承諾と制限）<br>①図書館は利用申請について業務上または技術上の支障がない場合、受付順にサービス利用を承諾することを原則とします。<br>②利用者の申請内容が図書館で規定した事項に違反している場合、承諾を保留することがあります。<br>③図書館はサービス利用申請が次のいずれかに該当する場合、その申請について承諾制限事由が解消されるまで承諾を保留することができます。<br>- システム設備の余裕がない場合<br>- システムの技術上の支障がある場合<br>- その他図書館の帰責事由で利用承諾が困難な場合<br>④図書館は会員登録手続き完了後、第6条第4項各号に該当する事由が判明した場合、利用承諾を取り消すことがあります。<br><br>第8条（個人情報の保護および使用）<br>①図書館は会員情報を「個人情報保護法」に基づき保護します。<br>②会員の個人情報は本人のみが閲覧、修正、削除できます。また、パスワード等が他人に漏れないよう徹底的に管理し、本人の会員番号、会員ID、パスワードが不正に使用されていることを発見した場合は直ちに図書館に報告しなければなりません。報告しないことで発生するすべての責任は会員本人が負います。<br>③図書館はサービス提供に関連して収集した会員の個人情報を、本人の承諾なしに第三者に漏洩、配布しません。ただし、次の場合は法律の範囲内で会員の個人情報を第三者に提供できます。<br>- 捜査機関や他の政府機関から情報提供を求められた場合<br>- 会員の法令または規約違反を含む不正行為確認など情報保護業務のために必要な場合<br>- その他法律で求められる場合<br><br>第3章 サービスの提供および利用<br>第9条（サービスの提供）<br>①図書館は会員の利用申請を承諾した時点からサービスを開始します。ただし、一部のサービスについては指定された日からサービスを開始します。<br>②オンラインサービス（ホームページ利用）は図書館の業務上または技術上特別な支障がない限り、年中無休、24時間運営を原則とします。ただし、図書館はシステムの定期点検、増設および交換のために定められた日や時間にサービスを一時中断することがあり、予定された作業によるサービス一時中断は図書館ホームページを通じて事前に告知します。<br>③オフラインサービス（資料室利用）は定期休館日である毎週月曜日および法定祝日は運営しません。休館日はホームページで告知します。<br>④図書館は緊急のシステム点検、増設および交換、設備の障害、サービス利用の急増、国家非常事態、停電等やむを得ない事由が発生した場合、事前予告なしにサービスの全部または一部を一時的に中断することがあります。<br>⑤図書館はサービスの改編等、運営上必要な場合、会員に事前予告後、サービスの全部または一部の提供を中止することができます。<br><br>第10条（サービスの変更）<br>①図書館は相当な理由がある場合、運営上・技術上の必要により、提供中の全てまたは一部のサービスを変更することができます。<br>②サービスの内容、利用方法、利用時間に変更がある場合、その変更理由、変更されるサービス内容および提供日などを変更前に当該サービスの初期画面に掲示しなければなりません。<br>③図書館は政策および運営上の必要により、事前告知を通じて無償で提供されるサービスの一部または全部を修正、中止、変更することができ、利用会員には別途補償を行いません。<br><br>第11条（サービス利用制限）<br>①図書館は会員がサービス利用内容において本規約第13条の内容に違反したり、次のいずれかに該当する場合、サービス利用制限、初期化、利用契約の解約およびその他の措置を行うことができます。<br>- 会員情報に不正な内容を登録したり、他人の会員番号、会員ID、パスワード等、その他の個人情報を盗用したり、会員番号を他人と取引または提供する行為<br>- 公共秩序および善良な風俗に違反する低俗、わいせつな内容や、他人の名誉やプライバシーを侵害する可能性のある内容を送信、投稿、電子メール等で他人に流布する行為<br>- 他の会員をからかったり脅したり、特定の会員に持続的に苦痛または不便を与える行為<br>- 違法複製やハッキングを助長する内容の場合<br>- 営利目的の広告の場合<br>- 図書館から特別な権利を与えられず、図書館が提供するプログラムを変更したり、サーバーをハッキングしたり、サイトまたは掲載情報の一部または全部を勝手に変更する行為<br>- サービスを通じて得た情報を図書館の承諾なしにサービス利用以外の目的で複製したり、出版や放送等に使用したり、第三者に提供する行為<br>- 図書館の運営陣、職員または関係者を騙ったり、故意にサービスを妨害するなど、正常なサービス運営を妨げる場合<br>- 放送通信審議委員会など関連公共機関の是正要求がある場合<br>- 規約を含め、図書館が定めた諸規定に違反したり、犯罪と結びつくと客観的に判断されるなど、諸法令に違反する行為<br>②会員は本条に基づく利用制限等について、図書館が定めた手続きに従って異議申立てをすることができ、正当と認められる場合は直ちにサービス利用を再開します。<br><br>第4章 契約当事者の義務<br>第12条（図書館の義務）<br>①図書館は会員が希望するサービス提供開始日に特別な事情がない限り、サービスを利用できるようにしなければなりません。<br>②図書館は継続的かつ安定的なサービス提供のため、設備に障害が発生したり滅失した場合、やむを得ない理由がない限り直ちに修理または復旧しなければなりません。<br>③図書館は会員が安全にサービスを利用できるよう、個人情報保護のためのセキュリティシステムを構築し、個人情報保護方針を公示し遵守しなければなりません。<br>④図書館は会員から提起された意見や苦情が正当と客観的に認められる場合、適切な手続きを経て直ちに対応しなければなりません。ただし、即時対応が困難な場合、会員にその理由と処理日程を通知しなければなりません。<br>⑤図書館は会員の帰責事由によるサービス利用障害について責任を負いません。<br><br>第13条（会員の義務）<br>①会員は会員登録申請または会員情報変更時、すべての事項を事実に基づいて本人の正確な情報で作成しなければならず、虚偽または他人の情報を登録した場合、これに関連するすべての権利を主張できません。<br>②会員は関係法令、本規約の規定、資料貸出規定、利用案内および図書館が告知した注意事項、図書館が通知する事項等を遵守し、その他図書館の業務に支障を与える行為、図書館の名誉を傷つける行為、他人に被害を与える行為をしてはなりません。<br>③会員は本人の会員番号、会員ID、パスワードを第三者に使用させてはならず、利用契約事項が変更された場合は該当手続きを経て直ちに図書館に知らせなければなりません。<br>④会員は図書館の事前承諾なしにサービスを利用していかなる営利行為もできず、その営利行為の結果について図書館は責任を負いません。また、会員がこのような営利行為で図書館に損害を与えた場合、会員は図書館に対して損害賠償義務を負い、図書館は該当会員に対してサービス利用制限および適法な手続きを経て損害賠償等を請求できます。<br>⑤会員は図書館の明示的な同意がない限り、サービスの利用権限、その他利用契約上の地位を他人に譲渡・贈与できず、これを担保として提供することはできません。<br>⑥会員は図書館サービスを利用して得た情報を図書館の事前承諾なしに複写、複製、変更、翻訳、出版・放送その他の方法で使用したり、これを他人に提供してはなりません。<br>⑦会員は図書館および第三者の知的財産権を含む諸権利を侵害したり、次のいずれかの行為をしてはなりません。<br>- 他の会員の会員番号を不正使用する行為<br>- 犯罪行為を目的としたり、その他犯罪行為と関連する行為<br>- 良俗その他社会秩序を害する行為<br>- 他人の名誉を毀損または侮辱する行為<br>- 他人の知的財産権等の権利を侵害する行為<br>- ハッキング行為またはコンピュータウイルスの流布行為<br>- 他人の意思に反して広告性情報など一定内容を継続して送信する行為<br>- サービスの安全な運営に支障を与える、またはそのおそれがある一切の行為<br><br>第5章 契約解除<br>第14条（損害賠償）<br>図書館はサービス利用に関連し、故意・過失によらない限り、会員に発生したいかなる損害についても責任を負いません。<br><br>第15条（免責事項）<br>①図書館は天災、戦争、基幹通信事業者のサービス中止およびその他これに準ずる不可抗力によりサービスを提供できない場合、サービス提供について責任を免除します。<br>②図書館はサービス用設備の保守、交換、定期点検、工事等やむを得ない事由により発生した損害について責任を免除します。<br>③図書館は会員のコンピュータのエラーによって損害が発生した場合、または会員が個人情報および電子メールアドレスを不備に記載して損害が発生した場合、責任を負いません。<br>④図書館は会員がサービスを利用して期待する結果を得られなかったことや失ったことについて責任を負いません。また、サービス利用中に得た資料による損害についても責任を負いません。<br>⑤図書館は会員がサービスに掲示した各種情報、資料、事実の信頼性、正確性等内容について責任を負いません。会員同士および会員と第三者間でサービスを媒介として発生した紛争についても関与義務がなく、それによる損害賠償責任も負いません。<br>⑥図書館は会員の投稿を登録前に事前審査したり、常時投稿内容を確認または検討する義務はなく、その結果に対して責任を負いません。<br><br>第16条（管轄裁判所）<br>本サービス利用により発生した紛争について訴訟が提起される場合、ソウル地方裁判所を管轄裁判所とします。<br><br>附則<br>本規約は2025年6月1日から適用および施行されます。<br>本規約は利用者が会員登録した時点で効力を生じます。<br>

# 홈페이지 이용 안내 / 개인정보처리방침
etc73.privacy_policy=グローバルイン図書館が取り扱うすべての個人情報は、関連法令に基づくか、情報主体の同意により収集・保有および処理されています。<br>\
個人情報保護法は、このような個人情報の取り扱いに関する一般的な規範を提示しており、グローバルイン図書館は、これらの法令の規定に従って収集・保有・処理される個人情報を、公務の適切な遂行および利用者の権益保護のために、適法かつ適切に取り扱います。<br>\
また、グローバルイン図書館は、関連法令で規定されたとおり、グローバルイン図書館が保有する個人情報の閲覧、訂正、削除、処理停止請求権など、皆様の権益を尊重し、利用者はこのような法令上の権益侵害について、行政審判法に基づき行政審判を請求することができます。<br>\
グローバルイン図書館の個人情報保護方針は、グローバルイン図書館が運営する各種ホームページ利用者の個人情報保護、所管業務のために必要な個人情報の取り扱い（コンピュータによる処理）、CCTV設置・運用に関する情報保護（永登浦区庁提供）という3つの部分で構成されています。<br><br>\
第1条 個人情報の処理目的<br>\
1. 個人情報は次の目的のために処理します。処理した個人情報は、次の目的以外では使用せず、利用目的が変更される場合は、個人情報保護法第18条に基づき別途同意を得るなど必要な措置を講じます。<br>\
A. サービス提供<br>- 図書館利用（資料貸出・返却、本人確認、満足度調査、証明書発行など）サービス提供に関する目的で個人情報を処理します。<br>\
B. 苦情処理<br>- 図書館利用に関する問い合わせ、意見提出、個人情報の閲覧、訂正、削除、処理停止要求、個人情報漏洩事故の報告など、個人情報に関する苦情処理を目的に個人情報を処理します。<br>\
2. グローバルイン図書館が処理する個人情報の目的は次の通りです。<br>\
<table><tr><th>番号</th><th>個人情報ファイル名</th><th>処理目的</th><th>備考</th></tr>\
<tr><td>1</td><td>図書貸出会員DB</td><td>図書貸出など図書館サービス利用に伴う本人識別</td><td></td></tr></table>\
<br>第2条 個人情報の処理および保有期間<br>\
1. 個人情報は原則として処理目的が達成された場合、遅滞なく廃棄します。<br>\
2. グローバルイン図書館は、関係法令に基づく個人情報の保有・利用期間、または情報主体から個人情報収集時に同意を受けた保有・利用期間の範囲で個人情報を収集・利用します。各個人情報の保有および利用期間は次の通りです。<br>\
- サービス提供および単純報告、行政業務参考資料等証明書類：1～3年<br>\
- 会計処理および関連根拠資料：5年<br>\
- 図書貸出会員DB：図書館法28条、情報主体の同意/会員同意時まで（2年ごとに再同意）<br><br>\
第3条 個人情報の第三者提供<br>\
1. グローバルイン図書館は、情報主体の同意、法令の特別な規定等、個人情報保護法第17条および第18条に該当する場合のみ、個人情報を第三者に提供し、それ以外の場合は情報主体の個人情報を第三者に提供しません。<br>\
2. 個人情報の閲覧、訂正・削除、処理停止要求等の苦情処理のため、申請者の個人情報を個人情報ファイル保有機関が閲覧できるようにしています。<br>\
3. 個人情報の閲覧、訂正・削除、処理停止、廃棄要求ユーザー情報は次の通りです。<br>\
A. 苦情申請を行った公的機関に、個人情報主体が閲覧、訂正・削除、処理停止、廃棄を申請した場合、関連公的機関に苦情関連の個人情報を提供し、苦情処理完了時まで保有・利用します。<br>\
B. 提供する個人情報項目：申請者氏名、生年月日、電話番号、住所<br><br>\
